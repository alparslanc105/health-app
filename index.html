<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FitTrack</title>

    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="./style.css">
</head>

<body>

<header>
    <h1 data-i18n="title">FitTrack</h1>

    <button id="langToggle">EN/NL</button>
</header>

<main>

    <!-- DASHBOARD -->
    <section class="card">
        <h2 data-i18n="dashboard">Dashboard</h2>

        <p id="totalExercises"></p>
        <p id="totalWorkouts"></p>
        <p id="totalVolume"></p>
        <p id="streakText"></p>
    </section>

    <!-- ADD EXERCISE -->
    <section class="card">
        <h2 data-i18n="addExercise">Add Exercise</h2>

        <input id="exerciseName" placeholder="Name">
        <input id="exerciseCategory" placeholder="Category">

        <button id="addExerciseBtn">Save</button>

        <ul id="exerciseList"></ul>
    </section>

    <!-- WORKOUT BUILDER -->
    <section class="card">
        <h2>Workout Builder</h2>

        <select id="exerciseSelect"></select>

        <input id="setsInput" placeholder="Sets">
        <input id="repsInput" placeholder="Reps">

        <button id="addWorkoutBtn">Add</button>

        <ul id="workoutList"></ul>
    </section>

    <!-- FOLLOW ALONG -->
    <section class="card">
        <h2>Follow Along</h2>

        <button id="startWorkout">Start</button>

        <div id="workoutScreen">
            <h3 id="exerciseTitle"></h3>
            <p id="setInfo"></p>
            <p id="repInfo"></p>
            <button id="nextBtn">Next</button>
        </div>
    </section>

    <!-- TIMER -->
    <section class="card">
        <h2>Timer</h2>

        <p id="timer">00:00</p>
        <button id="startTimer">Start Timer</button>
    </section>

    <!-- FILTER (F2) -->
    <section class="card">
        <h2>Workouts</h2>

        <select id="periodFilter">
            <option value="all">All</option>
            <option value="day">Today</option>
            <option value="week">Week</option>
            <option value="month">Month</option>
        </select>
    </section>

</main>

<footer>
    <p>FitTrack PWA</p>
</footer>

<script src="./app.js"></script>

</body>
</html>
